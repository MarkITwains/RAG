[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-rag"
version = "0.1.0"
description = "PCB domain retrieval-augmented generation system with Milvus, Ollama, rerank, and Dify integration."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
# 开发 / CI 依赖：只包含测试与静态检查所需，刻意不引入 requirements.txt 中的
# 重型运行时依赖（torch、llama-index、pymilvus 等），保证 CI 轻量快速。
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "chardet>=5.0",
]

# 「让关键回归测试真的跑起来」所需的最小依赖。
#
# 问题背景：`ACL 过滤合并`（security.merge_filters）是曾经出过真实权限 bug 的地方，
# 它的回归测试用 pytest.importorskip("llama_index.core") 守卫 —— 没装依赖时
# **静默跳过**，而 skipped 不会让流水线变红。"CI 全绿"于是可能意味着"这条测试根本没跑"。
# 这里只装过滤器所需的最小集合（llama-index-core + Milvus 过滤器编译器），
# 不涉及 torch / 模型权重 / Milvus 服务，安装量可控。
test_llama = [
    "llama-index-core>=0.11",
    "llama-index-vector-stores-milvus>=0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff —— 静态检查（对应 Go 项目的 golangci-lint）
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# 与 Ruff 内置默认集一致，聚焦「确定性问题」：
#   E4 导入、E7 语句、E9 运行时语法、F pyflakes（未定义名 / 未使用等）
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 存量模块的技术债豁免（新增文件不受影响），逐条清理后可删除对应项：
#   E402：导入刻意位于 venv / proxy bootstrap 之后，属于设计需要
#   F401 / F811：历史遗留的未使用导入与重复导入
#   F541：历史遗留的无占位符 f-string
#   F841：历史遗留的未使用局部变量
#   F821：字符串类型注解引用了仅在函数内导入的 np / torch（运行时不求值，仅影响类型检查）
"src/pcb_rag/*.py" = ["E402", "F401", "F811", "F541", "F841", "F821"]
"eval/*.py" = ["F401"]

# ---------------------------------------------------------------------------
# Pytest —— 单元测试（对应 Go 项目的 go test）
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# 让 src/ 与仓库根都可导入，使 pcb_rag 与 eval 两个包在未安装时也能被测试引用
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
