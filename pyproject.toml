[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-rag"
version = "0.1.0"
description = "PCB domain retrieval-augmented generation system with Milvus, Ollama, rerank, and Dify integration."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
# The runtime profile covers API models, ingestion, HTTP and Milvus clients.
# Model weights and local torch rerankers remain separately installable.
runtime = [
    "llama-index-core>=0.14.25,<0.15",
    "llama-index-vector-stores-milvus>=1.2,<2",
    "llama-index-readers-file>=0.7,<0.8",
    "llama-index-llms-openai-like>=0.8.1,<0.9",
    "llama-index-embeddings-openai>=0.7,<0.8",
    "pymilvus>=2.6.17,<2.7",
    "fastapi>=0.150,<0.151",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "httpx>=0.28,<0.29",
    "requests>=2.34,<3",
    "nest-asyncio>=1.6,<2",
    "chardet>=5,<8",
    "numpy>=1.26,<3",
    "tqdm>=4.67,<5",
    "jieba>=0.42.1,<0.43",
    "pypdf>=6,<7",
    "pymupdf>=1.28,<2",
    "python-docx>=1.2,<2",
]
ollama = [
    "llama-index-llms-ollama>=0.6,<1",
    "llama-index-embeddings-ollama>=0.4,<1",
]
local_models = [
    "torch>=2.4,<3",
    "transformers>=4.45,<5",
    "sentence-transformers>=3,<4",
    "huggingface-hub>=0.25,<1",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.17.2,<0.18",
    "build>=1.6,<2",
    "chardet>=5,<8",
]

# Compatibility extra for older setup commands. The full suite uses runtime.
test_llama = [
    "llama-index-core>=0.14.25,<0.15",
    "llama-index-vector-stores-milvus>=1.2,<2",
    "llama-index-embeddings-openai>=0.7,<0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Web 界面是单文件静态页，必须显式声明，否则 pip install 后 404。
[tool.setuptools.package-data]
pcb_rag = ["webui/*.html"]

# ---------------------------------------------------------------------------
# Ruff —— 静态检查（对应 Go 项目的 golangci-lint）
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# 与 Ruff 内置默认集一致，聚焦「确定性问题」：
#   E4 导入、E7 语句、E9 运行时语法、F pyflakes（未定义名 / 未使用等）
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These entry points load the deployment environment before model imports.
"src/pcb_rag/query.py" = ["E402"]
"src/pcb_rag/ingest.py" = ["E402"]
"src/pcb_rag/dify_external_api.py" = ["E402"]

# ---------------------------------------------------------------------------
# Pytest —— 单元测试（对应 Go 项目的 go test）
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# 让 src/ 与仓库根都可导入，使 pcb_rag 与 eval 两个包在未安装时也能被测试引用
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires an explicitly enabled local Milvus service",
    "local_model: requires optional local model dependencies; excluded from API-only runs",
]
