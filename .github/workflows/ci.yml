# PCB-RAG CI：静态检查 + 构建 + 单元测试
#
# 三个 job 与 Go 项目的常见流水线一一对应：
#   golangci-lint -> lint  : ruff check / ruff format --check
#   go build      -> build : pip install -e . + compileall + sdist/wheel
#   go test       -> test  : pytest（Python 版本矩阵 + 覆盖率）
#
# 说明：requirements.txt 中的运行时依赖（torch、模型权重、Milvus 客户端等）体积巨大，
# 因此测试以不依赖外部服务的纯逻辑模块为主（语义缓存、融合、增量比对、评测指标、
# 文档预处理），由 build job 的 compileall 负责其余模块的语法校验。
#
# 但**不装依赖 ≠ 可以静默跳过关键回归**：ACL 过滤合并这类出过真实 bug 的地方，
# 其测试用 pytest.importorskip 守卫，缺依赖时会被 skip，而 skipped 不会让流水线变红。
# 因此这里额外安装 .[test_llama]（llama-index-core + Milvus 过滤器编译器，
# 不含 torch / 模型 / Milvus 服务），并用 REQUIRE_LLAMA_INDEX=1 让
# tests/test_ci_dependencies.py 把"关键测试是否被跳过"变成硬失败。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # =1 时 tests/test_ci_dependencies.py 会校验关键回归测试的依赖齐全，
  # 缺依赖 = 失败（而不是 skip）
  REQUIRE_LLAMA_INDEX: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check . --output-format=github

      - name: ruff format --check (tests)
        run: ruff format --check tests

  build:
    name: build (compileall + dist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Install package (editable)
        run: python -m pip install -e .

      - name: Byte-compile all Python sources
        run: python -m compileall -q src eval scripts tests

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev + 关键回归测试所需的最小依赖
        run: python -m pip install -e ".[dev,test_llama]"

      - name: Run pytest
        run: pytest -q -rs --cov=pcb_rag --cov=eval --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
