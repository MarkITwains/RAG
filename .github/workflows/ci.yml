# PCB-RAG CI：静态检查 + 构建 + 单元测试
#
# 三个 job 与 Go 项目的常见流水线一一对应：
#   golangci-lint -> lint  : ruff check / ruff format --check
#   go build      -> build : pip install -e . + compileall + sdist/wheel
#   go test       -> test  : pytest（Python 版本矩阵 + 覆盖率）
#
# 说明：requirements.txt 中的运行时依赖（torch、llama-index、pymilvus 等）体积巨大，
# 因此测试只覆盖不依赖外部服务的纯逻辑模块（语义缓存、评测指标、文档预处理），
# 由 build job 的 compileall 负责其余模块的语法校验。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check . --output-format=github

      - name: ruff format --check (tests)
        run: ruff format --check tests

  build:
    name: build (compileall + dist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Install package (editable)
        run: python -m pip install -e .

      - name: Byte-compile all Python sources
        run: python -m compileall -q src eval scripts tests

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q --cov=pcb_rag --cov=eval --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
